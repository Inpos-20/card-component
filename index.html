<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @font-face {
        font-family: Figtree;
        src: url("./assets/fonts/Figtree-VariableFont_wght.ttf");
      }

      * {
        padding: 0;
        margin: 0;
      }

      p {
        font-size: 16px;
      }

      body {
        background-color: hsl(47, 88%, 63%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background-color: hsl(0, 0%, 100%);
        width: 340px;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid hsl(0, 0%, 7%);
      }

      .main-image {
        width: 100%;
        border-radius: 12px;
      }

      .text-container > * {
        font-family: Figtree;
      }

      .learning-state {
        background-color: hsl(47, 88%, 63%);
        padding: 4px 12px;
        margin-top: 20px;
        font-size: 16px;
        font-weight: 800;
        border-radius: 4px;
        display: inline-block;
      }

      .date-posted {
        margin-top: 12px;
      }

      .title {
        font-size: x-large;
        margin-top: 16px;
      }

      .description {
        color: hsl(0, 0%, 42%);
        margin-top: 16px;
        line-height: 150%;
      }

      .person-container {
        margin-top: 24px;
        display: flex;
        align-items: center;
      }

      .pfp-image {
        width: 40px;
      }

      .person-name {
        font-size: medium;
        margin-left: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        class="main-image"
        src="./assets/images/illustration-article.svg"
        alt="Main Image"
      />
      <div class="text-container">
        <h2 class="learning-state">Learning</h2>
        <p class="date-posted">Published 21 Dec 2023</p>
        <h1 class="title">HTML & CSS foundations</h1>
        <p class="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="person-container">
          <img
            class="pfp-image"
            src="./assets/images/image-avatar.webp"
            alt="Greg Hooper Profile Picture"
          />
          <h3 class="person-name">Greg Hooper</h3>
        </div>
      </div>
    </div>
  </body>
</html>
